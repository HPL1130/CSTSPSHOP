<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYOTA 風格分頁跳轉 - 完整置換程式碼</title>
    
    <style>
        /* 基礎設定 - 為了讓置換後的程式碼能在瀏覽器中顯示置中 */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        
        /* --- 分頁外層容器 --- */
        .pagination-wrapper {
            display: flex;
            align-items: center;
            justify-content: center; /* 置中對齊 */
            flex-wrap: wrap;
            gap: 5px; /* 按鈕間距 */
            margin-top: 20px;
        }

        /* --- 按鈕基礎樣式 --- */
        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            min-width: 36px;
            padding: 0 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .page-btn.nav-btn {
            font-weight: bold;
            padding: 0 15px;
        }

        /* --- 滑鼠移入效果 (TOYOTA 紅 #EB1923) --- */
        .page-btn:hover {
            border-color: #EB1923;
            color: #EB1923;
            background-color: #fff5f5;
        }

        /* --- 當前頁面 (Active) --- */
        .page-btn.active {
            background-color: #EB1923;
            border-color: #EB1923;
            color: #fff;
        }

        /* --- 省略號 ... --- */
        .dots {
            color: #666;
            padding: 0 5px;
            font-weight: bold;
        }

        /* --- 跳轉區塊 (輸入框容器) --- */
        .jump-container {
            display: flex;
            align-items: center;
            height: 36px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            margin: 0 10px;
            overflow: hidden;
        }

        .jump-container:focus-within {
            border-color: #EB1923;
        }

        /* --- 輸入框本體 --- */
        .jump-input {
            width: 45px;
            height: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-size: 14px;
            color: #EB1923;
            font-weight: bold;
        }

        /* 總頁數文字 */
        .total-pages {
            color: #666;
            font-size: 14px;
            padding-right: 8px;
            white-space: nowrap;
        }

        /* 隱藏 input number 的上下箭頭 */
        .jump-input::-webkit-outer-spin-button,
        .jump-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .jump-input {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="pagination-wrapper">
        <a href="#" class="page-btn nav-btn">❮ 返回</a>

        <a href="#" class="page-btn active">1</a>
        <a href="#" class="page-btn">2</a>
        <a href="#" class="page-btn">3</a>
        <a href="#" class="page-btn">4</a>
        <a href="#" class="page-btn">5</a>
        
        <span class="dots">...</span>
        
        <a href="#" class="page-btn">26</a>

        <div class="jump-container">
            <input type="number" class="jump-input" value="1" id="pageJumpInput">
            <span class="total-pages">/ 26 頁</span>
        </div>

        <a href="#" class="page-btn nav-btn">下一頁 ❯</a>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var input = document.getElementById('pageJumpInput');
            var maxPage = 26; // **請修改為你網站的實際總頁數**

            if(input) {
                input.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        
                        var page = parseInt(this.value);

                        if (isNaN(page) || page < 1 || page > maxPage) {
                            alert('請輸入有效的頁碼 (1 ~ ' + maxPage + ')');
                            this.value = 1;
                        } else {
                            // *** 實際應用時，將下一行註解拿掉，並修改成你的換頁網址 ***
                            // window.location.href = "/your-page?page=" + page;
                            alert('正在執行跳轉至第 ' + page + ' 頁...'); 
                        }
                    }
                });
            }
        });
    </script>

</body>
</html>
