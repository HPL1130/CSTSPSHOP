<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>正新特約商店 APP</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/icons/icon-512x512.png">
</head>
<body>
<header class="site-header">
  <div class="hero-wrap">
    <img src="images/hero.png" class="hero" alt="正新輪胎企業識別圖" onerror="this.style.display='none'"/>
  </div>
  <div class="brand">正新特約商店 APP</div>
  <button id="toggleHero" class="hero-toggle" aria-expanded="true">收合</button> 
</header>

<main class="container">
  <!-- 類別篩選與搜尋 -->
  <div class="category-buttons" role="tablist" aria-label="類別篩選">
    <!-- ...原按鈕群略... -->
  </div>

  <div class="filters">
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="..."/></svg>
      <input id="keywordInput" type="text" placeholder="搜尋店名、優惠內容、地點..." aria-label="搜尋關鍵字"/>
    </div>
    <select id="districtFilter" aria-label="篩選地區"><option value="all">所有地區</option></select>
    <button id="reloadBtn" class="btn small" type="button" onclick="location.reload();">重新載入</button>
  </div>

  <div id="loadingMessage" class="loading-message" style="display:none;">⏳ 正在載入資料，請稍候...</div>
  <div id="shopList" class="shop-list" aria-live="polite"></div>

  <!-- 分頁區塊 -->
  <div class="pager">
    <button id="prevBtn" class="btn">上一頁</button>
    <span id="pageInfo" class="page-info">第 1 頁 / 共 2082 頁</span>
    <button id="nextBtn" class="btn">下一頁</button>
  </div>

  <!-- 跳轉頁碼功能 -->
  <div class="pagination-jump">
    <div class="page-links">
      <button class="page-btn">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">4</button>
      <button class="page-btn">5</button>
      <button class="page-btn">6</button>
      <button class="page-btn">7</button>
      <button class="page-btn">8</button>
      <button class="page-btn">9</button>
      <button class="page-btn">10</button>
      <span class="ellipsis">...</span>
      <button class="page-btn">2082</button>
    </div>
    <div class="jump-form">
      <input type="number" id="jumpInput" min="1" max="2082" placeholder="輸入頁碼"/>
      <button id="jumpBtn" class="btn small">跳轉</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 正新企業內部公告 · 特約商店查詢</p>
  <p style="font-size: 0.85rem; color: #ef4444; margin-top: 8px;">**優惠內容與適用條件依店家或福委會內部公告為準**</p>
</footer>

<script src="app.js"></script>
<script>
  // Service Worker 註冊
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

  // Banner 收合功能
  document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggleHero');
    const header = document.querySelector('.site-header');
    if(toggleBtn && header){
      toggleBtn.onclick = function(e) {
        e.preventDefault(); 
        header.classList.toggle('collapsed');
        const isCollapsed = header.classList.contains('collapsed');
        toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
        toggleBtn.textContent = isCollapsed ? '展開' : '收合';
        toggleBtn.style.background = isCollapsed ? '#fff' : 'var(--brand)';
        toggleBtn.style.color = isCollapsed ? 'var(--brand)' : '#fff';
      };
    }

    // 跳轉頁碼功能（範例）
    document.getElementById('jumpBtn').onclick = function() {
      const page = parseInt(document.getElementById('jumpInput').value);
      if (!isNaN(page) && page >= 1 && page <= 2082) {
        alert(`跳轉至第 ${page} 頁（此處可改為載入資料）`);
        // TODO: 載入指定頁資料
      }
    };

    document.querySelectorAll('.page-btn').forEach(btn => {
      btn.onclick = function() {
        const page = parseInt(btn.textContent);
        alert(`跳轉至第 ${page} 頁（此處可改為載入資料）`);
        // TODO: 載入指定頁資料
      };
    });
  });
</script>
</body>
</html>
