<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>正新特約商店 APP</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/icons/icon-512x512.png">
</head>
<body>
<header class="site-header">
  <div class="hero-wrap">
    <img src="images/hero.png" class="hero" alt="正新輪胎企業識別圖" onerror="this.style.display='none'"/>
  </div>
  <div class="brand">正新特約商店 APP</div>
  <button id="toggleHero" class="hero-toggle" aria-expanded="true">收合</button> 
</header>

<main class="container">
  <!-- 類別篩選與搜尋 -->
  <div class="category-buttons" role="tablist" aria-label="類別篩選">
    <button data-cat="all" class="active" type="button">全部</button>
    <button data-cat="food" type="button">美食</button>
    <button data-cat="medical" type="button">醫療</button>
    <!-- 其他類別略 -->
  </div>

  <div class="filters">
    <div class="search-wrapper">
      <input id="keywordInput" type="text" placeholder="搜尋店名、優惠內容、地點..." aria-label="搜尋關鍵字"/>
    </div>
    <select id="districtFilter" aria-label="篩選地區"><option value="all">所有地區</option></select>
    <button id="reloadBtn" class="btn small" type="button" onclick="location.reload();">重新載入</button>
  </div>

  <div id="loadingMessage" class="loading-message" style="display:none;">⏳ 正在載入資料，請稍候...</div>
  <div id="shopList" class="shop-list" aria-live="polite"></div>

  <!-- 分頁區塊 -->
  <div class="pager">
    <button id="prevBtn" class="btn">上一頁</button>
    <span id="pageInfo" class="page-info">第 1 頁 / 共 1 頁</span>
    <button id="nextBtn" class="btn">下一頁</button>
  </div>

  <!-- 跳轉頁碼功能 -->
  <div class="pagination-jump">
    <div id="pageLinks" class="page-links"></div>
    <div class="jump-form">
      <input type="number" id="jumpInput" min="1" placeholder="輸入頁碼"/>
      <button id="jumpBtn" class="btn small">跳轉</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2025 正新企業內部公告 · 特約商店查詢</p>
  <p style="font-size: 0.85rem; color: #ef4444; margin-top: 8px;">**優惠內容與適用條件依店家或福委會內部公告為準**</p>
</footer>

<script src="app.js"></script>
</body>
</html>
