
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CST 正新特約商店地圖</title>

  <!-- PWA Manifest -->
  ./manifest.json

  <!-- 主樣式 -->
  ./styles.css

  <!-- 品牌字體可後續加入（如 Noto Sans TC） -->
</head>
<body>
  <!-- Header（含品牌與 hero） -->
  <header class="site-header">
    <div class="brand">CST 正新特約商店地圖</div>
    <div class="hero-wrap">
      ./images/hero.png
      <!-- 可選：收合按鈕
      <button class="hero-toggle" type="button">收合</button>
      -->
    </div>
  </header>

  <div class="container">
    <!-- 類別按鈕（⚠️ data-cat 要用 shop_data.json 的英文字母 slug） -->
    <div class="category-buttons">
      <button data-cat="all" class="active">./images/categories/all.png全部</button>
      <button data-cat="medical">./images/categories/medical.png醫療保健</button>
      <button data-cat="food">./images/categories/food.png美食餐飲</button>
      <button data-cat="leisure">./images/categories/leisure.png休閒住宿</button>
      <button data-cat="daily">./images/categories/daily.png生活用品</button>
      <button data-cat="learning">./images/categories/learning.png學習教育</button>
      <button data-cat="moto">./images/categories/moto.png機/腳踏車</button>
      <button data-cat="3c">./images/categories/3c.png3C通訊</button>
      <button data-cat="car"><img src="./images/categories服務</button>
      <button data-cat="finance">./images/categories/finance.png金融保險</button>
      <button data-cat="other">./images/categories/other.png其他類</button>
    </div>

    <!-- 篩選器與搜尋 -->
    <section class="filters">
      <select id="districtFilter">
        <!-- 初始選項要有 value="all" 才能配合 app.js 的邏輯 -->
        <option value="all">所有地區</option>
      </select>
      <input id="keywordInput" type="search" placeholder="輸入關鍵字（店名／優惠／地點）…" />
    </section>

    <!-- 列表（配合 styles.css 的 .shop-list 格線） -->
    <main id="shopList" class="shop-list"></main>

    <!-- 分頁 -->
    <div class="pager">
      <button id="prevBtn" class="btn">上一頁</button>
      <span id="pageInfo" class="page-info">1 / 1</span>
      <button id="nextBtn" class="btn">下一頁</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2025 正新輪胎特約商店 · 資訊僅供參考</p>
    <p>詳細優惠內容與條件，請依各商店公告為準。</p>
  </footer>

  <!-- 主程式（要放在 body 結尾，確保 DOM 皆已存在） -->
  ./app.js</script>

  <!-- 註冊 Service Worker（⚠️ 需 https 或 localhost；file:// 無法註冊） -->
  <script>
    if ('serviceWorker' in navigator) {
      // 在 http(s) 來源下，讓 sw.js 進行快取與離線支援
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
