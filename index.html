
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>正新特約商店 APP</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/icons/icon-512x512.png">
</head>
<body>
<header class="site-header">
    <div class="hero-wrap">
      <img src="images/hero.png" class="hero" alt="正新輪胎企業識別圖" onerror="this.style.display='none'"/>
    </div>
    <div class="brand">正新特約商店 APP</div>
    <button id="toggleHero" class="hero-toggle" aria-expanded="true">收合</button> 
  </header>

  <main class="container">
    <div class="category-buttons" role="tablist" aria-label="類別篩選">
      <button data-cat="all" class="active" type="button"><img src="images/categories/all.png" alt=""> 全部</button>
      <button data-cat="medical" type="button"><img src="images/categories/medical.png" alt=""> 醫療</button>
      <button data-cat="food" type="button"><img src="images/categories/food.png" alt=""> 美食</button>
      <button data-cat="leisure" type="button"><img src="images/categories/leisure.png" alt=""> 休閒</button>
      <button data-cat="daily" type="button"><img src="images/categories/daily.png" alt=""> 生活用品</button>
      <button data-cat="learning" type="button"><img src="images/categories/learning.png" alt=""> 學習</button>
      <button data-cat="moto" type="button"><img src="images/categories/moto.png" alt=""> 機車/單車</button>
      <button data-cat="3c" type="button"><img src="images/categories/3c.png" alt=""> 3C</button>
      <button data-cat="car" type="button"><img src="images/categories/car.png" alt=""> 汽車</button>
      <button data-cat="finance" type="button"><img src="images/categories/finance.png" alt=""> 銀行/保險</button>
      <button data-cat="other" type="button"><img src="images/categories/other.png" alt=""> 其他</button>
    </div>

    <div class="filters">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"></path></svg>
        <input id="keywordInput" type="text" placeholder="搜尋店名、優惠內容、地點..." aria-label="搜尋關鍵字"/>
      </div>
      <select id="districtFilter" aria-label="篩選地區"><option value="all">所有地區</option></select>
      <button id="reloadBtn" class="btn small" type="button" onclick="location.reload();">重新載入</button>
    </div>

    <!-- 載入中提示 -->
    <div id="loadingMessage" class="loading-message" style="display:none;">
      ⏳ 正在載入資料，請稍候...
    </div>

    <div id="shopList" class="shop-list" aria-live="polite"></div>

    <div class="pager">
      <button id="prevBtn" class="btn">上一頁</button>
      <span id="pageInfo" class="page-info">第 1 頁 / 共 1 頁</span>
      <button id="nextBtn" class="btn">下一頁</button>
    </div>
    <div class="pagination-container">
    <a href="#" class="page-btn prev">
        <span class="icon">❮</span> 返回
    </a>

    <div class="page-numbers">
        <a href="#" class="page-num active">1</a>
        <a href="#" class="page-num">2</a>
        <a href="#" class="page-num">3</a>
        <a href="#" class="page-num">4</a>
        <a href="#" class="page-num">5</a>
        <span class="dots">...</span>
        <a href="#" class="page-num">26</a>
    </div>

    <div class="jump-section">
        <div class="input-group">
            <input type="number" value="1" min="1" max="26" class="page-input">
            <span class="total-pages">/ 26 頁</span>
        </div>
    </div>

    <a href="#" class="page-btn next">
        下一頁 <span class="icon">❯</span>
    </a>
</div>
  </main>

  <footer class="site-footer">
    <p>
      © 2025 正新企業內部公告 · 特約商店查詢
    </p>
    <p style="font-size: 0.85rem; color: #ef4444; margin-top: 8px;">
      **優惠內容與適用條件依店家或福委會內部公告為準**
    </p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Service Worker 註冊 (PWA 離線支援)
    if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

    // --- 橫幅收合功能 (Banner Toggle) ---
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('toggleHero');
      const header = document.querySelector('.site-header');

      if(toggleBtn && header){
        toggleBtn.onclick = function(e) {
          e.preventDefault(); 
          header.classList.toggle('collapsed');
          const isCollapsed = header.classList.contains('collapsed');
          toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
          if (isCollapsed) {
            toggleBtn.textContent = '展開';
            toggleBtn.style.background = '#fff';
            toggleBtn.style.color = 'var(--brand)';
          } else {
            toggleBtn.textContent = '收合';
            toggleBtn.style.background = 'var(--brand)';
            toggleBtn.style.color = '#fff';
          }
        };
      }
    });
  </script>
</body>
</html>
