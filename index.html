
<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正新特約商店 APP</title>
  styles.css
</head>
<body>
  <!-- 頁首：延續原有風格 -->
  <header class="site-header">
    <div class="brand">正新企業識別圖｜正新特約商店 APP</div>
    <div class="hero-wrap">
      <!-- hero 圖片可依原先配置，保留容器不動 -->
      <img class="hero" src="" alt="" />
    </div>
    <!-- 若原本有收合按鈕，保留即可 -->
    <!-- <button class="hero-toggle">重新載入</button> -->
  </header>

  <main class="container">
    <!-- 分類按鈕：保留原有結構與 class -->
    <div class="category-buttons">
      <!-- 依原始資料，預設第一個為全部 -->
      <button class="active" data-cat="all">全部</button>
      <button data-cat="醫療">醫療</button>
      <button data-cat="美食">美食</button>
      <button data-cat="休閒">休閒</button>
      <button data-cat="生活用品">生活用品</button>
      <button data-cat="學習">學習</button>
      <button data-cat="機車/單車">機車/單車</button>
      <button data-cat="3C">3C</button>
      <button data-cat="汽車">汽車</button>
      <button data-cat="銀行/保險">銀行/保險</button>
      <button data-cat="其他">其他</button>
    </div>

    <!-- 篩選區：保留原有外觀 -->
    <div class="filters">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="keywordInput" type="search" placeholder="輸入關鍵字…" />
      </div>

      <select id="districtFilter">
        <option value="all">所有地區</option>
        <!-- 其餘選項由 JS 動態注入 -->
      </select>

      <!-- 重新載入（非必須） -->
      <button id="reloadBtn" class="btn small" onclick="location.reload()">重新載入</button>
    </div>

    <!-- Loading 訊息：保留 -->
    <div id="loadingMessage" class="loading-message" style="display:none;">
      ⏳ 正在載入資料，請稍候...
    </div>

    <!-- 列表區：保留原有 class 與 id -->
    <div id="shopList" class="shop-list"></div>

    <!-- 分頁資訊（文字）：保留 -->
    <div id="pageInfo" class="pager" aria-live="polite"></div>

    <!-- ✅ 新的分頁列（數字頁碼＋跳轉框），不影響原有外觀 -->
    <div class="pager" role="navigation" aria-label="頁碼導覽">
      <!-- 使用既有 prevBtn / nextBtn id，避免動到既有邏輯 -->
      <button id="prevBtn" class="btn small" aria-label="上一頁">« 上一頁</button>

      <!-- 數字頁碼容器（JS 動態塞入 1~10 等） -->
      <div id="pageNumbers" class="page-numbers"></div>

      <!-- 省略號與最後一頁（JS 控制顯示） -->
      <span id="ellipsis" class="ellipsis" style="display:none;">…</span>
      <button id="lastPageBtn" class="btn small" style="display:none;"></button>

      <!-- 跳轉輸入框 -->
      <div class="jump-wrapper">
        <input id="jumpInput" type="number" class="jump-input" min="1" aria-label="輸入頁碼" />
        <span id="totalPagesText" class="total-pages"></span>
        <button id="jumpBtn" class="btn small" aria-label="跳轉到指定頁">跳轉</button>
      </div>

      <button id="nextBtn" class="btn small" aria-label="下一頁">下一頁 »</button>
    </div>
  </main>

  <footer class="site-footer">
    © 2025 正新企業內部公告 · 特約商店查詢
    <br/>
    <small>**優惠內容與適用條件依店家或福委會內部公告為準**</small>
  </footer>

  app.js</script>
</body>
